schema_version: "1.1"
name: plans-full-migration-readonly
expected_outcome: |
  A read-only inventory of every active model with a class (1:1 wrapper vs needs a transform vs model-on-model etc.),
  a proposed action per model, waves ordered by model-on-model dependencies, and a migration plan that says which PRs
  carry what and what happens on the instance, plus a concrete list of decisions for the user (schemas, schedules,
  Library folders, owners, metadata conflicts, model-only features, removal grace period). Nothing written to Metabase or git.
